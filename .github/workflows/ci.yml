name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_SECRET: ci-build-secret-ci-build-secret-0123456789
      # Optional: dedicated Neon test branch (reserved for integration tests from Release 3A).
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm test
      - run: npm run build
      # Release 7B: public pages must not ship admin-only code and must stay under the JavaScript budget.
      - run: npm run check:bundles
      # Release 7B: known vulnerabilities in the packages that run in production. Moderate and below are reviewed monthly
      # (docs/SECURITY.md lists the accepted ones); a NEW high or critical finding fails the build.
      - run: npm audit --omit=dev --audit-level=critical

  e2e:
    name: Playwright smoke
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # Dedicated Neon test branch (pooled string; firstload + phase scripts run, e2e admin created with set-admin.sql). Never production.
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      # Optional gate: without the E2E_DATABASE_URL secret (forks, Dependabot, a fresh repo) the smoke tests are
      # skipped with a warning instead of failing on a 503 from /go. Add the secret to run them.
      - name: Check e2e database secret
        id: gate
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Playwright smoke skipped::E2E_DATABASE_URL secret is missing or empty, so the e2e tests did not run. Add it under Settings > Secrets and variables > Actions (and under Dependabot secrets for Dependabot PRs)."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'
      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
        if: steps.gate.outputs.enabled == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.enabled == 'true'
      - run: npm run build
        if: steps.gate.outputs.enabled == 'true'
      - run: npx playwright test
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
