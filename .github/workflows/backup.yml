name: Monthly database backup

# Release 7B. Takes a logical dump of the production Neon database on the 1st of each month and stores it as an encrypted
# workflow artifact for 90 days (the longest GitHub keeps). A copy kept ONLY here is not "off-platform" enough: once a month,
# download the artifact and keep it somewhere that is neither Neon, Vercel nor GitHub (docs/BACKUP.md).
# Secrets needed (Settings > Secrets and variables > Actions): BACKUP_DATABASE_URL (the UNPOOLED Neon string), BACKUP_PASSPHRASE.

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$PASS" ]; then
            echo "::error title=Backup not configured::Add the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets (docs/BACKUP.md)."
            exit 1
          fi
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Dump and encrypt
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          ./scripts/backup-dump.sh out
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 out/*.sql.gz
          rm out/*.sql.gz
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: khushio-backup-${{ github.run_id }}
          path: out/*.gpg
          retention-days: 90
          if-no-files-found: error
